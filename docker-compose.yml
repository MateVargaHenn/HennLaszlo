name: hennlaszlo-preview

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_PASSWORD: ${SEQ_PASSWORD:?set SEQ_PASSWORD}
    volumes:
      - seq-data:/data
    ports:
      - "127.0.0.1:15341:80"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      AdminAuthentication__Username: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      AdminAuthentication__PasswordHash: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      FileStorage__RootPath: /app/storage
      Seq__ServerUrl: http://seq:80
    volumes:
      - file-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  frontend:
    build:
      context: ./frontend/henn-laszlo
      target: public
    restart: unless-stopped
    environment:
      PORT: "4000"
      INTERNAL_API_ORIGIN: http://backend:8080
      NG_ALLOWED_HOSTS: ${PREVIEW_HOST:?set PREVIEW_HOST},localhost,127.0.0.1
      NG_TRUST_PROXY_HEADERS: X-FORWARDED-PROTO
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./frontend/henn-laszlo
      target: admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./deploy/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/preview.htpasswd:/etc/nginx/preview.htpasswd:ro
    depends_on:
      - frontend
      - admin
      - backend

volumes:
  postgres-data:
  rabbitmq-data:
  seq-data:
  file-storage:
