  <title id="signature-title">Henn László András animált aláírása</title>

  <style>
    .reveal {
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .reveal--first {
      animation: write 0.45s 0.1s ease-out forwards;
    }

    .reveal--second {
      animation: write 0.45s 0.4s ease-out forwards;
    }

    .reveal--word {
      animation: write 1.25s 0.75s ease-in-out forwards;
    }

    @keyframes write {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

