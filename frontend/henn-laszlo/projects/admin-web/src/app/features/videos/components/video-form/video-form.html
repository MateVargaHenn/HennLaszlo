<form
  class="overflow-hidden rounded-2xl border border-stone-200 bg-white shadow-xl shadow-stone-900/5"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <section class="p-6 sm:p-8 lg:p-10">
    <header class="mb-10">
      <p class="text-xs uppercase tracking-[0.24em] text-stone-500">Videó adatai</p>

      <h2 class="mt-3 font-serif text-3xl text-stone-950">
        {{ mode() === 'edit' ? 'Videó szerkesztése' : 'Új videó' }}
      </h2>

      <p class="mt-3 max-w-2xl text-sm leading-6 text-stone-600">
        A magyar cím és a HTTPS-videóhivatkozás kötelező. YouTube megosztási és böngészőből kimásolt
        hivatkozás is használható.
      </p>
    </header>

    <div class="space-y-9">
      <fieldset>
        <legend class="mb-4 text-sm font-semibold text-stone-900">Megnevezés</legend>

        <div class="grid gap-5 sm:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium text-stone-800">
              Magyar cím
              <span class="text-red-700">*</span>
            </span>

            <input
              type="text"
              formControlName="titleHu"
              class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
            />

            @if (form.controls.titleHu.touched && form.controls.titleHu.invalid) {
              <span class="mt-2 block text-sm text-red-700"> A magyar cím megadása kötelező. </span>
            }
          </label>

          <label class="block">
            <span class="text-sm font-medium text-stone-800">
              Angol cím
              <span class="font-normal text-stone-400">– opcionális</span>
            </span>

            <input
              type="text"
              formControlName="titleEn"
              class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
            />
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend class="mb-4 text-sm font-semibold text-stone-900">Videóhivatkozás</legend>

        <label class="block">
          <span class="text-sm font-medium text-stone-800">
            HTTPS URL
            <span class="text-red-700">*</span>
          </span>

          <input
            type="url"
            inputmode="url"
            placeholder="https://www.youtube.com/watch?v=…"
            formControlName="videoUrl"
            class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
          />

          @if (form.controls.videoUrl.touched && form.controls.videoUrl.invalid) {
            <span class="mt-2 block text-sm text-red-700">
              Adj meg egy érvényes, https:// kezdetű hivatkozást.
            </span>
          }

          @if (form.controls.videoUrl.valid && form.controls.videoUrl.value) {
            <a
              class="mt-3 inline-flex text-sm font-medium text-teal-700 underline decoration-teal-300 underline-offset-4 hover:text-teal-900"
              [href]="form.controls.videoUrl.value"
              target="_blank"
              rel="noopener noreferrer"
            >
              Hivatkozás ellenőrzése
            </a>
          }
        </label>
      </fieldset>

      <fieldset>
        <legend class="mb-4 text-sm font-semibold text-stone-900">Megjelenítés</legend>

        <div class="grid gap-5 sm:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium text-stone-800">Év</span>

            <input
              type="number"
              min="1"
              [max]="maximumYear"
              formControlName="year"
              class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
            />

            @if (form.controls.year.touched && form.controls.year.invalid) {
              <span class="mt-2 block text-sm text-red-700">
                Az év legfeljebb {{ maximumYear }} lehet.
              </span>
            }
          </label>

          <label class="block">
            <span class="text-sm font-medium text-stone-800">Sorrend</span>

            <input
              type="number"
              min="0"
              formControlName="displayOrder"
              class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
            />

            <span class="mt-2 block text-xs leading-5 text-stone-500">
              0 az első pozíció. A többi videó automatikusan eltolódik.
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend class="mb-4 text-sm font-semibold text-stone-900">Leírás</legend>

        <div class="grid gap-5 lg:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium text-stone-800"> Magyar leírás </span>

            <textarea
              rows="6"
              formControlName="descriptionHu"
              class="mt-2 block w-full resize-y rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
            ></textarea>
          </label>

          <label class="block">
            <span class="text-sm font-medium text-stone-800"> Angol leírás </span>

            <textarea
              rows="6"
              formControlName="descriptionEn"
              class="mt-2 block w-full resize-y rounded-lg border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-stone-900 focus:ring-1 focus:ring-stone-900"
            ></textarea>
          </label>
        </div>
      </fieldset>
    </div>
  </section>

  <footer
    class="flex flex-col gap-4 border-t border-stone-200 bg-stone-50 px-6 py-5 sm:flex-row sm:items-center sm:justify-between sm:px-8"
  >
    <div>
      @if (submitError(); as error) {
        <p class="text-sm text-red-700" role="alert">
          {{ error }}
        </p>
      }
    </div>

    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        class="rounded-lg px-5 py-3 font-medium text-stone-700 transition-colors hover:bg-stone-200 disabled:opacity-60"
        [disabled]="isSubmitting()"
        (click)="cancel()"
      >
        Mégse
      </button>

      <button
        type="submit"
        class="rounded-lg bg-stone-950 px-6 py-3 font-medium text-white transition-colors hover:bg-stone-800 disabled:cursor-wait disabled:opacity-60"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          Mentés…
        } @else {
          {{ mode() === 'edit' ? 'Módosítások mentése' : 'Videó létrehozása' }}
        }
      </button>
    </div>
  </footer>
</form>
