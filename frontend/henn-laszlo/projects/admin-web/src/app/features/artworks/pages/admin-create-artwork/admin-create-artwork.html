<main class="min-h-screen bg-stone-100 px-5 py-8 text-stone-900 sm:px-8 lg:py-12">
  <div class="mx-auto max-w-7xl">
    <a
      routerLink="/artworks"
      class="inline-flex items-center gap-2 text-sm font-medium text-stone-600 transition hover:text-stone-950"
    >
      <span aria-hidden="true">←</span>
      Vissza a művekhez
    </a>

    <header class="mb-8 mt-6">
      <p class="text-sm uppercase tracking-[0.2em] text-stone-500">
        Adminisztráció
      </p>

      <h1 class="mt-2 font-serif text-4xl text-stone-950 sm:text-5xl">
        Új mű feltöltése
      </h1>

      <p class="mt-4 max-w-2xl leading-7 text-stone-600">
        Add meg az alkotás ismert adatait és válaszd ki
        a hozzá tartozó képet. A mű elsőként vázlatként
        kerül mentésre.
      </p>
    </header>

    <app-artwork-form
      [isSubmitting]="isSubmitting()"
      [submitError]="submitError()"
      (submitted)="save($event)"
      (cancelled)="cancel()"
    />
  </div>
</main>
