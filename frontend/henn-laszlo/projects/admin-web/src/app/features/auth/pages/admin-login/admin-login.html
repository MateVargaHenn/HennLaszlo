<main>
  <section aria-labelledby="login-title">
    <p>Henn László András</p>

    <h1 id="login-title">
      Adminisztráció
    </h1>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <div>
        <label for="username">
          Felhasználónév
        </label>

        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
        />

        @if (
          form.controls.username.touched &&
          form.controls.username.invalid
        ) {
          <p>Írd be a felhasználónevet.</p>
        }
      </div>

      <div>
        <label for="password">
          Jelszó
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />

        @if (
          form.controls.password.touched &&
          form.controls.password.invalid
        ) {
          <p>Írd be a jelszót.</p>
        }
      </div>

      @if (loginError()) {
        <p role="alert">
          {{ loginError() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          Belépés…
        } @else {
          Belépés
        }
      </button>
    </form>
  </section>
</main>
