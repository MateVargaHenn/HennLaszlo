name: Preview VPS preflight

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/preview-vps-preflight.yml
      - deploy/host-nginx.conf.example
      - deploy/ip-challenge.nginx.conf.example
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: private-preview
    steps:
      - name: Configure pinned SSH host key
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$KNOWN_HOSTS" && test -n "$PRIVATE_KEY"
          mkdir -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/preview_key
      - name: Read-only VPS checks
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/preview_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -eu
          for port in 80 443 18080 18443; do
            if ss -ltn "( sport = :$port )" | tail -n +2 | grep -q .; then
              echo "port_${port}=occupied"
            else
              echo "port_${port}=free"
            fi
          done
          if docker compose version >/dev/null 2>&1 && docker info >/dev/null 2>&1; then echo docker=available; else echo docker=unavailable; fi
          if command -v certbot >/dev/null 2>&1; then certbot --version; else echo certbot=missing; fi
          if sudo -n true >/dev/null 2>&1; then echo passwordless_sudo=yes; else echo passwordless_sudo=no; fi
          if command -v nginx >/dev/null 2>&1; then echo nginx=installed; else echo nginx=missing; fi
          if test -d /var/www/hennlaszlo-preview/.git; then echo checkout=yes; else echo checkout=no; fi
          if test -s /var/www/hennlaszlo-preview/.env; then echo env=yes; else echo env=no; fi
          if test -s /var/www/hennlaszlo-preview/deploy/preview.htpasswd; then echo htpasswd=yes; else echo htpasswd=no; fi
          if sudo -n nginx -T 2>/dev/null | grep -Eq 'server_name[[:space:]]+194[.]182[.]85[.]127[[:space:];]'; then echo ip_vhost=present; else echo ip_vhost=absent_or_unreadable; fi
          REMOTE
